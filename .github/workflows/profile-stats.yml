name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-stats.mjs"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Update public repository snapshot and SVG
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: node scripts/update-stats.mjs
      - name: Commit updated stats
        run: |
          if git diff --quiet -- assets/github-activity.svg scripts/repos-snapshot.json; then
            echo "Profile stats are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg scripts/repos-snapshot.json
          git commit -m "Refresh public repository stats"
          git push
